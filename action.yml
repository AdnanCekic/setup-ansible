name: Setup Ansible
description: Install a pinned ansible-core into an isolated virtualenv with uv. Works on GitHub-hosted and self-hosted runners without sudo.
author: AdnanCekic
branding:
  icon: terminal
  color: gray-dark

inputs:
  version:
    description: ansible-core version to install, e.g. "2.20.1".
    required: true
  python-version:
    description: Python version for the virtualenv. uv downloads it when the runner does not have it.
    default: "3.12"
  extra-packages:
    description: Extra pip packages installed into the same virtualenv, space separated. The ansible-core pin applies to them as a constraint, so they cannot upgrade it.
    default: ""

outputs:
  ansible-version:
    description: The installed ansible-core version.
    value: ${{ steps.install.outputs.ansible-version }}
  venv:
    description: Path to the virtualenv. Its bin directory is on PATH for later steps.
    value: ${{ steps.install.outputs.venv }}

runs:
  using: composite
  steps:
    - name: Check runner
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "::error::Ansible does not run on Windows as a control node. Use a Linux or macOS runner."
          exit 1
        fi

    # Pinned to a commit: this action runs on runners that hold deployment
    # secrets, so a moved upstream tag must not change what executes.
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: "false"

    # uv builds the venv and seeds pip itself, so neither sudo nor the venv
    # and ensurepip modules (stripped from Ubuntu's system Python) are needed.
    # Inputs reach the script through env, never through ${{ }} in the script
    # text.
    - name: Install ansible-core
      id: install
      shell: bash
      env:
        ANSIBLE_CORE_VERSION: ${{ inputs.version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail

        if [[ ! "$ANSIBLE_CORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)$ ]]; then
          echo "::error::version must be an exact ansible-core version such as 2.20.1, got '$ANSIBLE_CORE_VERSION'."
          exit 1
        fi

        venv="$RUNNER_TEMP/setup-ansible/venv"
        rm -rf "$venv"
        uv venv --quiet --seed --python "$PYTHON_VERSION" "$venv"

        # The ${extra[@]+...} form keeps an empty list working under set -u in
        # bash 3.2 (macOS /bin/bash).
        read -r -a extra <<< "$EXTRA_PACKAGES"
        uv pip install --python "$venv/bin/python" "ansible-core==$ANSIBLE_CORE_VERSION" ${extra[@]+"${extra[@]}"}

        installed="$("$venv/bin/python" -c 'from importlib.metadata import version; print(version("ansible-core"))')"
        if [[ "$installed" != "$ANSIBLE_CORE_VERSION" ]]; then
          echo "::error::Expected ansible-core $ANSIBLE_CORE_VERSION, got $installed."
          exit 1
        fi

        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
        echo "ansible-version=$installed" >> "$GITHUB_OUTPUT"
        echo "venv=$venv" >> "$GITHUB_OUTPUT"

        "$venv/bin/ansible" --version
